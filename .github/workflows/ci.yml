name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build backend, package, and release tooling
        run: |
          python -m pip install --upgrade pip "setuptools>=69" wheel
          python -m pip install -e '.[dev]'
      - name: Validate Agent Skill/package
        run: python scripts/validate.py
      - name: Unit and integration tests
        run: python scripts/test_runtime.py
      - name: Coverage gate
        run: |
          python -m coverage erase
          python -m coverage run --source=runtime/janef_one -m unittest discover -s tests -p 'test_*.py'
          python -m coverage report --fail-under=90
      - name: Deterministic runtime benchmark
        run: python scripts/benchmark_runtime.py
      - name: Compile check
        run: python -m compileall -q runtime scripts tests
      - name: Self Skill Firewall
        run: |
          python -m janef_one scan-skill . --allowlist .janef-one-firewall-allowlist.json > self-scan.json
          python - <<'PY'
          import json
          data=json.load(open('self-scan.json'))
          assert data['decision']=='allow', data
          assert data['score']==100, data
          PY
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist
      - name: Reproducible release package
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          python scripts/package_release.py
          cp "../janef-one-v${VERSION}.zip" /tmp/one.zip
          python scripts/package_release.py
          cmp /tmp/one.zip "../janef-one-v${VERSION}.zip"
