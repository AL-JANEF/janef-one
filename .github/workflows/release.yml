name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e '.[dev]'
      - name: Verify tag matches manifest
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Full quality gate
        run: python scripts/quality_gate.py
      - name: Build runtime wheel
        shell: bash
        run: |
          mkdir -p ../janef-one-dist
          python -m pip wheel . --no-deps --no-build-isolation -w ../janef-one-dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          WHEEL=$(find ../janef-one-dist -maxdepth 1 -type f -name "janef_one_runtime-${VERSION}-*.whl" -print -quit)
          gh release create "v${VERSION}" \
            "../janef-one-v${VERSION}.zip" \
            "../janef-one-v${VERSION}.zip.sha256" \
            "../janef-one-v${VERSION}-quality.json" \
            "$WHEEL" \
            --title "JANEF ONE v${VERSION} — One kernel. Every agent." \
            --notes-file "RELEASE_NOTES_v${VERSION}.md"
