name: Bug report
description: Report a reproducible JANEF ONE defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not post secrets or vulnerability details here. Use a private security advisory for security issues."
  - type: input
    id: version
    attributes:
      label: JANEF ONE version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Host runtime / agent
      placeholder: "Claude Code, Codex, Gemini CLI, Cursor, OpenCode, other"
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
